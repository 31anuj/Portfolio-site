name: Deploy portfolio

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  BUCKET: portfolio-site-euw1
  DIST_ID: ENX42446MX554
  ROLE_ARN: arn:aws:iam::558215002777:role/github-actions-portfolio-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show identity
        run: aws sts get-caller-identity

      - name: Upload index.html to S3
        run: aws s3 cp index.html "s3://${BUCKET}/index.html" --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${DIST_ID}" --paths "/index.html" "/"
